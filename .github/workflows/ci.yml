name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017
      DATABASE_NAME: lumen_ci
      JWT_SECRET_KEY: ci-secret-key-not-used-in-production
      GEMINI_API_KEY: ci-placeholder
      KILO_API_BASE: https://api.kilo.ai/api/gateway
      NVIDIA_EMBEDDING_BASE: https://integrate.api.nvidia.com/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile
        working-directory: backend
        run: python -m compileall -q app scripts tests

      - name: Tests
        working-directory: backend
        # The provider tests need live API keys, so only the offline suite
        # runs in CI. Run `pytest tests/test_providers.py` locally to check them.
        run: python -m pytest tests/test_general_hub.py -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
